name: Feature request
description: An idea that would make Tandem better.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea, if you have one. Sketches and examples are welcome.
  - type: checkboxes
    id: rules
    attributes:
      label: Tandem's ground rules
      description: Tandem never modifies the Claude app and never touches sign-in data ([details](https://github.com/Arman-Manteghi/Tandem/blob/main/CONTRIBUTING.md#ground-rules)).
      options:
        - label: This idea works within those rules.
          required: true
