name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        run: dotnet publish src/Tandem.App --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: Tandem
          path: publish/Tandem.exe
          retention-days: 14
